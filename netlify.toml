[build]
  command = "npm run build"
  publish = "dist"

# SPA redirect fix (VERY IMPORTANT)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional API proxy
# Change the URL to your backend server
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-domain.com/:splat"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prevent caching HTML
[[headers]]
  for = "/*.html"

  [headers.values]
    Cache-Control = "no-cache"